<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 610" role="img" aria-labelledby="vm-title vm-desc">
  <title id="vm-title">The V-model of verification and validation</title>
  <desc id="vm-desc">A V-shaped lifecycle map. Down the left arm, stakeholder needs decompose into system requirements, architecture, and component design. At the vertex, implementation. Up the right arm, components are verified, subsystems integrated and tested, the system verified, and the system validated. Dashed horizontal links connect each right-arm activity to the left-arm artifact it verifies or validates against.</desc>

  <defs>
    <marker id="vm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#1a1f1c"/>
    </marker>
  </defs>

  <!-- Kicker and title -->
  <text x="410" y="34" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" letter-spacing="4" fill="#6b7268">V&amp;V ACROSS THE LIFECYCLE</text>
  <text x="410" y="68" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#1a1f1c">The V-model: decomposition, integration, and the V&amp;V thread</text>

  <!-- ============ LEFT ARM: decomposition ============ -->
  <!-- L0 -->
  <rect x="28" y="111" width="250" height="58" fill="#fffdf8" stroke="#d9d4c5" stroke-width="1"/>
  <text x="48" y="134" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="bold" fill="#1a1f1c">Stakeholder needs</text>
  <text x="48" y="153" font-family="Georgia, 'Times New Roman', serif" font-size="11" font-style="italic" fill="#6b7268">concept · CONOPS</text>
  <!-- L1 -->
  <rect x="28" y="193" width="250" height="58" fill="#fffdf8" stroke="#d9d4c5" stroke-width="1"/>
  <text x="48" y="216" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="bold" fill="#1a1f1c">System requirements</text>
  <text x="48" y="235" font-family="Georgia, 'Times New Roman', serif" font-size="11" font-style="italic" fill="#6b7268">requirements baseline</text>
  <!-- L2 -->
  <rect x="28" y="275" width="250" height="58" fill="#fffdf8" stroke="#d9d4c5" stroke-width="1"/>
  <text x="48" y="298" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="bold" fill="#1a1f1c">System architecture</text>
  <text x="48" y="317" font-family="Georgia, 'Times New Roman', serif" font-size="11" font-style="italic" fill="#6b7268">allocated requirements</text>
  <!-- L3 -->
  <rect x="28" y="357" width="250" height="58" fill="#fffdf8" stroke="#d9d4c5" stroke-width="1"/>
  <text x="48" y="380" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="bold" fill="#1a1f1c">Subsystem &amp; component design</text>
  <text x="48" y="399" font-family="Georgia, 'Times New Roman', serif" font-size="11" font-style="italic" fill="#6b7268">detailed design specs</text>

  <!-- ============ RIGHT ARM: integration & test ============ -->
  <!-- R0 -->
  <rect x="542" y="111" width="250" height="58" fill="#fffdf8" stroke="#d9d4c5" stroke-width="1"/>
  <text x="562" y="134" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="bold" fill="#1a1f1c">System validation</text>
  <text x="562" y="153" font-family="Georgia, 'Times New Roman', serif" font-size="11" font-style="italic" fill="#6b7268">acceptance testing</text>
  <!-- R1 -->
  <rect x="542" y="193" width="250" height="58" fill="#fffdf8" stroke="#d9d4c5" stroke-width="1"/>
  <text x="562" y="216" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="bold" fill="#1a1f1c">System verification</text>
  <text x="562" y="235" font-family="Georgia, 'Times New Roman', serif" font-size="11" font-style="italic" fill="#6b7268">against requirements baseline</text>
  <!-- R2 -->
  <rect x="542" y="275" width="250" height="58" fill="#fffdf8" stroke="#d9d4c5" stroke-width="1"/>
  <text x="562" y="298" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="bold" fill="#1a1f1c">Subsystem integration &amp; test</text>
  <text x="562" y="317" font-family="Georgia, 'Times New Roman', serif" font-size="11" font-style="italic" fill="#6b7268">against allocated requirements</text>
  <!-- R3 -->
  <rect x="542" y="357" width="250" height="58" fill="#fffdf8" stroke="#d9d4c5" stroke-width="1"/>
  <text x="562" y="380" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="bold" fill="#1a1f1c">Component verification</text>
  <text x="562" y="399" font-family="Georgia, 'Times New Roman', serif" font-size="11" font-style="italic" fill="#6b7268">unit · inspection · test</text>

  <!-- ============ VERTEX: implementation ============ -->
  <rect x="285" y="480" width="250" height="58" fill="#1d5c3f" stroke="#1d5c3f" stroke-width="1"/>
  <text x="410" y="503" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="bold" fill="#ffffff">Implementation</text>
  <text x="410" y="522" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" font-style="italic" fill="#f6f4ee">build · code · fabrication</text>

  <!-- ============ LEFT ARM arrows (down) ============ -->
  <line x1="153" y1="169" x2="153" y2="187" stroke="#1a1f1c" stroke-width="1.5" marker-end="url(#vm-arrow)"/>
  <line x1="153" y1="251" x2="153" y2="269" stroke="#1a1f1c" stroke-width="1.5" marker-end="url(#vm-arrow)"/>
  <line x1="153" y1="333" x2="153" y2="351" stroke="#1a1f1c" stroke-width="1.5" marker-end="url(#vm-arrow)"/>
  <!-- left arm down to vertex level, then into implementation -->
  <line x1="153" y1="415" x2="153" y2="509" stroke="#1a1f1c" stroke-width="1.5"/>
  <line x1="153" y1="509" x2="279" y2="509" stroke="#1a1f1c" stroke-width="1.5" marker-end="url(#vm-arrow)"/>

  <!-- ============ RIGHT ARM arrows (up) ============ -->
  <!-- out of implementation to right column, then up -->
  <line x1="541" y1="509" x2="667" y2="509" stroke="#1a1f1c" stroke-width="1.5"/>
  <line x1="667" y1="509" x2="667" y2="415" stroke="#1a1f1c" stroke-width="1.5"/>
  <line x1="667" y1="351" x2="667" y2="339" stroke="#1a1f1c" stroke-width="1.5" marker-end="url(#vm-arrow)"/>
  <line x1="667" y1="269" x2="667" y2="257" stroke="#1a1f1c" stroke-width="1.5" marker-end="url(#vm-arrow)"/>
  <line x1="667" y1="187" x2="667" y2="175" stroke="#1a1f1c" stroke-width="1.5" marker-end="url(#vm-arrow)"/>

  <!-- ============ Dashed V&V links across levels ============ -->
  <line x1="278" y1="140" x2="542" y2="140" stroke="#1d5c3f" stroke-opacity="0.55" stroke-width="1" stroke-dasharray="6,5"/>
  <text x="410" y="130" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11.5" font-style="italic" fill="#1d5c3f">acceptance criteria</text>
  <line x1="278" y1="222" x2="542" y2="222" stroke="#1d5c3f" stroke-opacity="0.55" stroke-width="1" stroke-dasharray="6,5"/>
  <text x="410" y="212" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11.5" font-style="italic" fill="#1d5c3f">system requirements</text>
  <line x1="278" y1="304" x2="542" y2="304" stroke="#1d5c3f" stroke-opacity="0.55" stroke-width="1" stroke-dasharray="6,5"/>
  <text x="410" y="294" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11.5" font-style="italic" fill="#1d5c3f">allocated requirements</text>
  <line x1="278" y1="386" x2="542" y2="386" stroke="#1d5c3f" stroke-opacity="0.55" stroke-width="1" stroke-dasharray="6,5"/>
  <text x="410" y="376" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11.5" font-style="italic" fill="#1d5c3f">component specifications</text>

  <!-- ============ Legend ============ -->
  <line x1="28" y1="578" x2="80" y2="578" stroke="#1a1f1c" stroke-width="1.5" marker-end="url(#vm-arrow)"/>
  <text x="88" y="582" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1a1f1c">flow: decompose (left) · integrate &amp; test (right)</text>
  <line x1="440" y1="578" x2="492" y2="578" stroke="#1d5c3f" stroke-width="1" stroke-dasharray="6,5"/>
  <text x="500" y="582" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1a1f1c">verification / validation link</text>
</svg>
