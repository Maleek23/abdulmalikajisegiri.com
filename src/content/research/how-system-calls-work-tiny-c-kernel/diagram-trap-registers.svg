<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-label="Register and privilege state before and after the trap instruction">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d5c3f"/>
    </marker>
  </defs>

  <!-- title -->
  <text x="400" y="32" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#1a1f1c">Before and after the trap instruction</text>
  <text x="400" y="55" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13" fill="#6b7268">the stub&#8217;s register contract — and what the CPU and kernel do with it (simplified illustration)</text>

  <!-- ============ PANEL 1: user mode ============ -->
  <rect x="24" y="76" width="330" height="300" rx="10" fill="none" stroke="#d8d4c6" stroke-width="1"/>
  <text x="44" y="104" font-family="Georgia, 'Times New Roman', serif" font-size="12" letter-spacing="1.5" fill="#1d5c3f">1 &#183; USER MODE — BEFORE ecall</text>

  <!-- register rows -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">
    <rect x="44" y="126" width="46" height="24" rx="5" fill="#1d5c3f"/>
    <text x="67" y="143" text-anchor="middle" fill="#f6f4ee">a0</text>
    <text x="102" y="143" fill="#1a1f1c">SYS_write&#160;&#160;(4)</text>

    <rect x="44" y="160" width="46" height="24" rx="5" fill="#1d5c3f"/>
    <text x="67" y="177" text-anchor="middle" fill="#f6f4ee">a1</text>
    <text x="102" y="177" fill="#1a1f1c">fd&#160;&#160;(1)</text>

    <rect x="44" y="194" width="46" height="24" rx="5" fill="#1d5c3f"/>
    <text x="67" y="211" text-anchor="middle" fill="#f6f4ee">a2</text>
    <text x="102" y="211" fill="#1a1f1c">buf</text>

    <rect x="44" y="228" width="46" height="24" rx="5" fill="#1d5c3f"/>
    <text x="67" y="245" text-anchor="middle" fill="#f6f4ee">a3</text>
    <text x="102" y="245" fill="#1a1f1c">count</text>
  </g>

  <line x1="44" y1="268" x2="334" y2="268" stroke="#d8d4c6" stroke-width="1"/>
  <text x="44" y="298" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1a1f1c">PC &#8594;</text>
  <rect x="100" y="282" width="70" height="26" rx="5" fill="none" stroke="#1d5c3f" stroke-width="1.5"/>
  <text x="135" y="299" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#1d5c3f">ecall</text>
  <text x="44" y="328" font-family="Georgia, 'Times New Roman', serif" font-size="11.5" fill="#6b7268">the only privileged act in the stub: one instruction</text>
  <text x="44" y="350" font-family="Georgia, 'Times New Roman', serif" font-size="11.5" fill="#6b7268">the contract: a number in a0, args in a1–a3, answer back in a0</text>

  <!-- ============ center: the trap ============ -->
  <line x1="358" y1="226" x2="438" y2="226" stroke="#1d5c3f" stroke-width="2" marker-end="url(#arr)"/>
  <text x="398" y="208" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#1d5c3f">ecall</text>
  <text x="398" y="250" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10" fill="#6b7268">saves PC + status</text>

  <!-- ============ PANEL 2: kernel mode ============ -->
  <rect x="446" y="76" width="330" height="300" rx="10" fill="none" stroke="#d8d4c6" stroke-width="1"/>
  <text x="466" y="104" font-family="Georgia, 'Times New Roman', serif" font-size="12" letter-spacing="1.5" fill="#1d5c3f">2 &#183; KERNEL MODE — INSIDE THE TRAP</text>

  <text x="466" y="132" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#6b7268">kernel stack (pushed on entry)</text>
  <rect x="466" y="140" width="140" height="180" rx="6" fill="none" stroke="#1a1f1c" stroke-width="1.25"/>
  <line x1="466" y1="200" x2="606" y2="200" stroke="#d8d4c6" stroke-width="1"/>
  <line x1="466" y1="260" x2="606" y2="260" stroke="#d8d4c6" stroke-width="1"/>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">
    <text x="536" y="168" fill="#1a1f1c">saved PC</text>
    <text x="536" y="186" fill="#6b7268" font-size="10">return address</text>
    <text x="536" y="228" fill="#1a1f1c">saved status</text>
    <text x="536" y="246" fill="#6b7268" font-size="10">privilege bits</text>
    <text x="536" y="288" fill="#1a1f1c">a0 – a3</text>
    <text x="536" y="306" fill="#6b7268" font-size="10">full user context</text>
  </g>

  <text x="626" y="152" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1d5c3f">CPU, atomically</text>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#1a1f1c">
    <text x="626" y="172">save PC + status</text>
    <text x="626" y="190">privileged mode</text>
    <text x="626" y="208">trap vector jump</text>
  </g>
  <text x="626" y="242" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1d5c3f">dispatcher</text>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#1a1f1c">
    <text x="626" y="262">reads a0 (= 4)</text>
    <text x="626" y="280">switch &#8594; sys_write()</text>
    <text x="626" y="298">in sys_file.c</text>
  </g>
  <text x="626" y="336" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#6b7268">no shared stack, no trust:</text>
  <text x="626" y="352" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#6b7268">every pointer validated</text>

  <!-- ============ return path ============ -->
  <text x="400" y="404" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12.5" fill="#1a1f1c">return-from-exception: a0 holds the byte count, registers restored</text>
  <text x="400" y="422" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12.5" fill="#6b7268">CPU drops to user mode at the saved PC</text>
  <path d="M 611 376 L 611 442 L 189 442" fill="none" stroke="#1d5c3f" stroke-width="2" marker-end="url(#arr)"/>
</svg>
