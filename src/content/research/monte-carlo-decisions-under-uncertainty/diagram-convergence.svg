<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Convergence of Monte Carlo survival-probability estimates toward the exact value 0.8225 as replication count grows from 1,000 to 100,000, with 95 percent confidence intervals shrinking around each estimate">
  <!-- Paper background (transparent so it sits on the article page); editorial ink/forest palette, no gradients -->
  <rect x="0" y="0" width="800" height="450" fill="none"/>

  <text x="400" y="34" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#1a1f1c">Survival-probability estimate converges to the exact answer</text>
  <text x="400" y="57" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-style="italic" fill="#6b7268">95% confidence intervals shrink roughly as 1/&#8730;N (illustrative toy run)</text>

  <!-- horizontal gridlines -->
  <g stroke="#d9d5c9" stroke-width="1">
    <line x1="150" y1="317.1" x2="690" y2="317.1"/>
    <line x1="150" y1="231.4" x2="690" y2="231.4"/>
    <line x1="150" y1="145.7" x2="690" y2="145.7"/>
    <line x1="150" y1="60.0" x2="690" y2="60.0"/>
  </g>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#6b7268" text-anchor="end">
    <text x="140" y="321.1">0.82</text>
    <text x="140" y="235.4">0.84</text>
    <text x="140" y="149.7">0.86</text>
    <text x="140" y="64.0">0.88</text>
  </g>

  <!-- exact dynamic-programming answer: 0.8225 -->
  <line x1="150" y1="306.4" x2="690" y2="306.4" stroke="#1d5c3f" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="696" y="301.0" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1d5c3f">exact: 0.8225</text>
  <text x="696" y="317.0" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-style="italic" fill="#1d5c3f">(dynamic programming)</text>

  <!-- 95% CI error bars + point estimates (log-spaced x: N = 1000, 10000, 100000) -->
  <g stroke="#1a1f1c" stroke-width="2">
    <line x1="150" y1="117.9" x2="150" y2="310.7"/>
    <line x1="140" y1="117.9" x2="160" y2="117.9"/>
    <line x1="140" y1="310.7" x2="160" y2="310.7"/>
    <line x1="420" y1="240.0" x2="420" y2="303.4"/>
    <line x1="410" y1="240.0" x2="430" y2="240.0"/>
    <line x1="410" y1="303.4" x2="430" y2="303.4"/>
    <line x1="690" y1="285.9" x2="690" y2="306.0"/>
    <line x1="680" y1="285.9" x2="700" y2="285.9"/>
    <line x1="680" y1="306.0" x2="700" y2="306.0"/>
  </g>
  <g fill="#1d5c3f" stroke="#1a1f1c" stroke-width="1">
    <circle cx="150" cy="214.3" r="6"/>
    <circle cx="420" cy="271.7" r="6"/>
    <circle cx="690" cy="295.7" r="6"/>
  </g>

  <!-- point labels -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#1a1f1c">
    <text x="164" y="218.3">0.8440</text>
    <text x="434" y="275.7">0.8306</text>
    <text x="704" y="299.7">0.8250</text>
  </g>

  <!-- x axis: log-spaced replication counts -->
  <line x1="150" y1="360" x2="690" y2="360" stroke="#1a1f1c" stroke-width="1.5"/>
  <g stroke="#1a1f1c" stroke-width="1.5">
    <line x1="150" y1="360" x2="150" y2="366"/>
    <line x1="420" y1="360" x2="420" y2="366"/>
    <line x1="690" y1="360" x2="690" y2="366"/>
  </g>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#1a1f1c" text-anchor="middle">
    <text x="150" y="388">N = 1,000</text>
    <text x="420" y="388">N = 10,000</text>
    <text x="690" y="388">N = 100,000</text>
  </g>
  <text x="420" y="414" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-style="italic" fill="#6b7268">replications N (log scale)</text>

  <!-- y axis label -->
  <text x="40" y="210" text-anchor="middle" transform="rotate(-90 40 210)" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-style="italic" fill="#6b7268">P(survive 100 hands)</text>
</svg>
