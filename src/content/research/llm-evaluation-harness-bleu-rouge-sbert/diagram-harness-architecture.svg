<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 720" font-family="Georgia, 'Times New Roman', serif">
  <rect x="0" y="0" width="800" height="720" fill="#f6f4ee"/>
  <rect x="8" y="8" width="784" height="704" fill="none" stroke="#d8d3c2" stroke-width="1"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1a1f1c"/>
    </marker>
    <marker id="arrowMuted" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6b7268"/>
    </marker>
  </defs>

  <text x="400" y="54" text-anchor="middle" font-size="24" fill="#1a1f1c">The evaluation harness</text>
  <text x="400" y="80" text-anchor="middle" font-size="13" font-style="italic" fill="#6b7268">five components, one deployment gate, and a feedback loop</text>

  <!-- stage boxes -->
  <g>
    <rect x="80" y="110" width="440" height="74" fill="#fffdf8" stroke="#1d5c3f" stroke-width="1.5"/>
    <circle cx="112" cy="147" r="16" fill="#1d5c3f"/>
    <text x="112" y="152" text-anchor="middle" font-size="15" fill="#fffdf8">1</text>
    <text x="140" y="141" font-size="17" fill="#1a1f1c">Prompt dataset + references</text>
    <text x="140" y="163" font-size="12.5" fill="#6b7268">versioned like code — task type, difficulty, edge cases</text>

    <rect x="80" y="214" width="440" height="74" fill="#fffdf8" stroke="#1d5c3f" stroke-width="1.5"/>
    <circle cx="112" cy="251" r="16" fill="#1d5c3f"/>
    <text x="112" y="256" text-anchor="middle" font-size="15" fill="#fffdf8">2</text>
    <text x="140" y="245" font-size="17" fill="#1a1f1c">Metric computation</text>
    <text x="140" y="267" font-size="12.5" fill="#6b7268">model under test runs prompts; stored per <tspan font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11">(model_version, prompt_id, metric)</tspan></text>

    <rect x="80" y="318" width="440" height="74" fill="#fffdf8" stroke="#1d5c3f" stroke-width="1.5"/>
    <circle cx="112" cy="355" r="16" fill="#1d5c3f"/>
    <text x="112" y="360" text-anchor="middle" font-size="15" fill="#fffdf8">3</text>
    <text x="140" y="349" font-size="17" fill="#1a1f1c">Risk tagging</text>
    <text x="140" y="371" font-size="12.5" fill="#6b7268">fixed taxonomy: hallucination · instruction-following</text>
    <text x="140" y="387" font-size="12.5" fill="#6b7268">toxicity/safety · format compliance</text>

    <rect x="80" y="422" width="440" height="74" fill="#fffdf8" stroke="#1d5c3f" stroke-width="1.5"/>
    <circle cx="112" cy="459" r="16" fill="#1d5c3f"/>
    <text x="112" y="464" text-anchor="middle" font-size="15" fill="#fffdf8">4</text>
    <text x="140" y="453" font-size="17" fill="#1a1f1c">Regression tracking</text>
    <text x="140" y="475" font-size="12.5" fill="#6b7268">metric deltas + tag-rate deltas across model versions</text>

    <rect x="80" y="526" width="440" height="74" fill="#fffdf8" stroke="#1d5c3f" stroke-width="1.5"/>
    <circle cx="112" cy="563" r="16" fill="#1d5c3f"/>
    <text x="112" y="568" text-anchor="middle" font-size="15" fill="#fffdf8">5</text>
    <text x="140" y="557" font-size="17" fill="#1a1f1c">Human spot-checks</text>
    <text x="140" y="579" font-size="12.5" fill="#6b7268">stratified sampling; agreement with metrics tracked</text>

    <!-- deployment gate -->
    <rect x="80" y="630" width="440" height="56" fill="#1d5c3f"/>
    <text x="300" y="654" text-anchor="middle" font-size="16" fill="#f6f4ee">Deployment gate</text>
    <text x="300" y="674" text-anchor="middle" font-size="12" font-style="italic" fill="#dfe8df">no promotion without a clean regression report</text>
  </g>

  <!-- arrows between stages -->
  <g stroke="#1a1f1c" stroke-width="1.5">
    <line x1="300" y1="184" x2="300" y2="210" marker-end="url(#arrow)"/>
    <line x1="300" y1="288" x2="300" y2="314" marker-end="url(#arrow)"/>
    <line x1="300" y1="392" x2="300" y2="418" marker-end="url(#arrow)"/>
    <line x1="300" y1="496" x2="300" y2="522" marker-end="url(#arrow)"/>
    <line x1="300" y1="600" x2="300" y2="626" marker-end="url(#arrow)"/>
  </g>

  <!-- feedback loop -->
  <path d="M 520,658 L 660,658 L 660,147 L 524,147" fill="none" stroke="#6b7268" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrowMuted)"/>
  <text transform="rotate(-90 640 400)" x="640" y="400" text-anchor="middle" font-size="12.5" font-style="italic" fill="#6b7268">production failures → regression cases → dataset commits</text>
</svg>
