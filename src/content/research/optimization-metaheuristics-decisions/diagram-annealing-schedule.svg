<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Illustrative sketch of simulated annealing: geometric temperature cooling schedule on the left, and best-so-far convergence of annealing versus greedy descent on a synthetic double-well landscape on the right.">
