<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 548" role="img" aria-labelledby="rsl-title rsl-desc">
  <title id="rsl-title">Reverse stress test loop: find the break point, then judge plausibility</title>
  <desc id="rsl-desc">Define the failure condition precisely, search scenario space for paths that produce it, assess whether the real world could walk those paths, then mitigate or monitor — and refresh as the portfolio changes.</desc>

  <defs>
    <marker id="rsl-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#1d5c3f"/>
    </marker>
  </defs>

  <text x="400" y="32" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" letter-spacing="4" fill="#6b7268">REVERSE STRESS TESTING · WORK BACKWARD FROM FAILURE</text>
  <text x="400" y="66" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#1a1f1c">Find the break point first</text>

  <!-- Step 1 -->
  <rect x="20" y="96" width="240" height="136" fill="#fffdf8" stroke="#d9d4c5" stroke-width="1"/>
  <circle cx="50" cy="130" r="13" fill="#1d5c3f"/>
  <text x="50" y="135" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="bold" fill="#ffffff">1</text>
  <text x="72" y="136" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="bold" fill="#1a1f1c">Define failure</text>
  <text x="42" y="166" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-style="italic" fill="#6b7268">what exactly counts as breaking?</text>
  <line x1="42" y1="180" x2="238" y2="180" stroke="#d9d4c5" stroke-width="1"/>
  <rect x="42" y="192" width="6" height="6" fill="#1d5c3f"/>
  <text x="56" y="198" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1a1f1c">capital breach, loss beyond tolerance</text>
  <rect x="42" y="208" width="6" height="6" fill="#1d5c3f"/>
  <text x="56" y="214" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1a1f1c">liquidity exhaustion — precise, not vague</text>

  <!-- Step 2 -->
  <rect x="280" y="96" width="240" height="136" fill="#fffdf8" stroke="#d9d4c5" stroke-width="1"/>
  <circle cx="310" cy="130" r="13" fill="#1d5c3f"/>
  <text x="310" y="135" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="bold" fill="#ffffff">2</text>
  <text x="332" y="136" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="bold" fill="#1a1f1c">Search scenarios</text>
  <text x="302" y="166" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-style="italic" fill="#6b7268">what inputs produce the failure?</text>
  <line x1="302" y1="180" x2="498" y2="180" stroke="#d9d4c5" stroke-width="1"/>
  <rect x="302" y="192" width="6" height="6" fill="#1d5c3f"/>
  <text x="316" y="198" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1a1f1c">grids and bisection over coherent shocks</text>
  <rect x="302" y="208" width="6" height="6" fill="#1d5c3f"/>
  <text x="316" y="214" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1a1f1c">find the minimum scenario that breaks you</text>

  <!-- Step 3 -->
  <rect x="540" y="96" width="240" height="136" fill="#fffdf8" stroke="#d9d4c5" stroke-width="1"/>
  <circle cx="570" cy="130" r="13" fill="#1d5c3f"/>
  <text x="570" y="135" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="bold" fill="#ffffff">3</text>
  <text x="592" y="136" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="bold" fill="#1a1f1c">Assess plausibility</text>
  <text x="562" y="166" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-style="italic" fill="#6b7268">could the world walk this path?</text>
  <line x1="562" y1="180" x2="758" y2="180" stroke="#d9d4c5" stroke-width="1"/>
  <rect x="562" y="192" width="6" height="6" fill="#1d5c3f"/>
  <text x="576" y="198" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1a1f1c">judge each failure path honestly</text>
  <rect x="562" y="208" width="6" height="6" fill="#1d5c3f"/>
  <text x="576" y="214" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1a1f1c">document the judgment, not just the result</text>

  <!-- Step connectors -->
  <line x1="262" y1="164" x2="274" y2="164" stroke="#1d5c3f" stroke-width="1.5" marker-end="url(#rsl-arrow)"/>
  <line x1="522" y1="164" x2="534" y2="164" stroke="#1d5c3f" stroke-width="1.5" marker-end="url(#rsl-arrow)"/>
  <path d="M 660 232 L 660 300 L 552 300" fill="none" stroke="#1d5c3f" stroke-width="1.5" marker-end="url(#rsl-arrow)"/>

  <!-- Decision diamond -->
  <path d="M 400 248 L 540 300 L 400 352 L 260 300 Z" fill="#fffdf8" stroke="#1d5c3f" stroke-width="1.5"/>
  <text x="400" y="295" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="2" fill="#1d5c3f">DECISION</text>
  <text x="400" y="314" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-style="italic" fill="#1a1f1c">plausible and unmitigated?</text>

  <!-- Outcome arrows -->
  <path d="M 372 352 L 196 404" fill="none" stroke="#1d5c3f" stroke-width="1.5" marker-end="url(#rsl-arrow)"/>
  <path d="M 428 352 L 604 404" fill="none" stroke="#1d5c3f" stroke-width="1.5" marker-end="url(#rsl-arrow)"/>
  <text x="272" y="386" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-style="italic" fill="#6b7268">yes</text>
  <text x="528" y="386" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-style="italic" fill="#6b7268">no</text>

  <!-- Outcome: mitigate -->
  <rect x="20" y="404" width="352" height="66" fill="#fffdf8" stroke="#1d5c3f" stroke-opacity="0.4" stroke-width="1"/>
  <text x="42" y="428" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="2" fill="#1d5c3f">MITIGATE</text>
  <text x="42" y="447" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1a1f1c">Hedge, set limits, build contingency plans.</text>
  <text x="42" y="462" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1a1f1c">Size capital and liquidity buffers against it.</text>

  <!-- Outcome: monitor -->
  <rect x="428" y="404" width="352" height="66" fill="#fffdf8" stroke="#d9d4c5" stroke-width="1"/>
  <text x="450" y="428" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="2" fill="#6b7268">MONITOR</text>
  <text x="450" y="447" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1a1f1c">Document why the path is accepted.</text>
  <text x="450" y="462" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1a1f1c">Watch the break point; re-test on change.</text>

  <!-- Refresh loop -->
  <rect x="20" y="490" width="760" height="30" fill="none" stroke="#d9d4c5" stroke-width="1"/>
  <path d="M 44 505 L 764 505" fill="none" stroke="#1d5c3f" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#rsl-arrow)"/>
  <text x="60" y="510" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" letter-spacing="2" fill="#1d5c3f">REFRESH</text>
  <text x="140" y="510" font-family="Georgia, 'Times New Roman', serif" font-size="11" font-style="italic" fill="#6b7268">re-run as the portfolio, markets, and the world change — scenarios decay.</text>
</svg>
