<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Illustrative plot of expected decision cost versus decision threshold under asymmetric costs.">
<rect x="0" y="0" width="800" height="450" rx="10" fill="#f6f4ee"/>
<text x="40" y="36" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#1a1f1c">Cost-aware thresholds: asymmetric costs move the optimum</text>
<text x="40" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#6b7268">Illustrative curve — C_FN : C_FP = 10 : 1 (a miss costs ten false alarms); not the cardiac project’s data.</text>
<line x1="84" y1="277.3" x2="740" y2="277.3" stroke="#d8d4c8" stroke-width="1"/>
<text x="74" y="281.3" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6b7268">0.5</text>
<line x1="84" y1="192.6" x2="740" y2="192.6" stroke="#d8d4c8" stroke-width="1"/>
<text x="74" y="196.6" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6b7268">1.0</text>
<line x1="84" y1="107.9" x2="740" y2="107.9" stroke="#d8d4c8" stroke-width="1"/>
<text x="74" y="111.9" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6b7268">1.5</text>
<line x1="120.4" y1="362" x2="120.4" y2="368" stroke="#6b7268" stroke-width="1"/>
<text x="120.4" y="384" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6b7268">0.1</text>
<line x1="193.3" y1="362" x2="193.3" y2="368" stroke="#6b7268" stroke-width="1"/>
<text x="193.3" y="384" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6b7268">0.2</text>
<line x1="266.2" y1="362" x2="266.2" y2="368" stroke="#6b7268" stroke-width="1"/>
<text x="266.2" y="384" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6b7268">0.3</text>
<line x1="339.1" y1="362" x2="339.1" y2="368" stroke="#6b7268" stroke-width="1"/>
<text x="339.1" y="384" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6b7268">0.4</text>
<line x1="412.0" y1="362" x2="412.0" y2="368" stroke="#6b7268" stroke-width="1"/>
<text x="412.0" y="384" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6b7268">0.5</text>
<line x1="484.9" y1="362" x2="484.9" y2="368" stroke="#6b7268" stroke-width="1"/>
<text x="484.9" y="384" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6b7268">0.6</text>
<line x1="557.8" y1="362" x2="557.8" y2="368" stroke="#6b7268" stroke-width="1"/>
<text x="557.8" y="384" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6b7268">0.7</text>
<line x1="630.7" y1="362" x2="630.7" y2="368" stroke="#6b7268" stroke-width="1"/>
<text x="630.7" y="384" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6b7268">0.8</text>
<line x1="703.6" y1="362" x2="703.6" y2="368" stroke="#6b7268" stroke-width="1"/>
<text x="703.6" y="384" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6b7268">0.9</text>
<line x1="84" y1="362" x2="740" y2="362" stroke="#1a1f1c" stroke-width="1.5"/>
<line x1="84" y1="74" x2="84" y2="362" stroke="#1a1f1c" stroke-width="1.5"/>
<text x="398.0" y="436" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1a1f1c">decision threshold t: flag if predicted risk &gt;= t</text>
<text x="22" y="218.0" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1a1f1c" transform="rotate(-90 22 218.0)">expected decision cost (illustrative)</text>
<path d="M84.0,234.7 L120.4,244.7 L156.9,253.0 L193.3,260.7 L229.8,267.9 L266.2,273.0 L302.7,276.1 L339.1,277.4 L375.6,277.8 L412.0,276.2 L448.4,272.8 L484.9,268.0 L521.3,261.1 L557.8,249.7 L594.2,233.5 L630.7,214.0 L667.1,184.2 L703.6,142.7 L740.0,83.5" fill="none" stroke="#1d5c3f" stroke-width="3" stroke-linejoin="round"/>
<line x1="412.0" y1="74" x2="412.0" y2="362" stroke="#6b7268" stroke-width="1.5" stroke-dasharray="6 5"/>
<line x1="375.6" y1="74" x2="375.6" y2="362" stroke="#1d5c3f" stroke-width="1.5" stroke-dasharray="6 5"/>
<circle cx="412.0" cy="276.2" r="5.5" fill="#6b7268"/>
<circle cx="375.6" cy="277.8" r="5.5" fill="#1d5c3f"/>
<line x1="98" y1="98" x2="136" y2="98" stroke="#6b7268" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="144" y="102" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" fill="#1a1f1c">naive default t = 0.5</text>
<line x1="98" y1="120" x2="136" y2="120" stroke="#1d5c3f" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="144" y="124" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" fill="#1a1f1c">cost-optimal t* &lt; 0.5</text>
<text x="98.0" y="170.2" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-style="italic" fill="#1a1f1c">accept more false alarms (cheap reviews)</text>
<text x="98.0" y="187.2" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-style="italic" fill="#1a1f1c">to buy fewer misses (expensive failures)</text>
</svg>
