<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="rl-title rl-desc">
  <title id="rl-title">Request lifecycle: validate once at the boundary</title>
  <desc id="rl-desc">A request enters the validate middleware, which runs schema.safeParse on the body. Valid requests attach req.validated and proceed to the handler; invalid ones are turned into a shaped 400 by shapeErrors.</desc>
  <defs>
    <marker id="rl-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1f1c"/>
    </marker>
  </defs>

  <!-- request -->
  <rect x="20" y="170" width="150" height="110" rx="10" fill="#f6f4ee" stroke="#d9d3c5" stroke-width="1"/>
  <text x="95" y="208" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#1a1f1c">HTTP request</text>
  <text x="95" y="238" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6b7268">POST /api/readings</text>

  <line x1="170" y1="225" x2="210" y2="225" stroke="#1a1f1c" stroke-width="1.5" marker-end="url(#rl-arrow)"/>

  <!-- middleware -->
  <rect x="210" y="170" width="170" height="110" rx="10" fill="#f6f4ee" stroke="#1d5c3f" stroke-width="1.5"/>
  <text x="295" y="208" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#1a1f1c">validate(readingSchema)</text>
  <text x="295" y="238" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12.5" font-style="italic" fill="#6b7268">middleware — validates once</text>

  <line x1="380" y1="225" x2="410" y2="225" stroke="#1a1f1c" stroke-width="1.5" marker-end="url(#rl-arrow)"/>

  <!-- decision diamond -->
  <polygon points="410,225 500,140 590,225 500,310" fill="#ffffff" stroke="#1d5c3f" stroke-width="2"/>
  <text x="500" y="220" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13.5" fill="#1a1f1c">safeParse</text>
  <text x="500" y="244" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-style="italic" fill="#6b7268">of req.body</text>

  <!-- valid branch -->
  <line x1="590" y1="225" x2="620" y2="225" stroke="#1a1f1c" stroke-width="1.5" marker-end="url(#rl-arrow)"/>
  <text x="605" y="210" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#1d5c3f">valid</text>

  <rect x="620" y="170" width="160" height="110" rx="10" fill="#1d5c3f"/>
  <text x="700" y="210" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#ffffff">req.validated</text>
  <text x="700" y="238" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12.5" font-style="italic" fill="#e8e4d8">fully typed</text>

  <line x1="700" y1="280" x2="700" y2="315" stroke="#1a1f1c" stroke-width="1.5" marker-end="url(#rl-arrow)"/>

  <rect x="620" y="315" width="160" height="95" rx="10" fill="#f6f4ee" stroke="#d9d3c5" stroke-width="1"/>
  <text x="700" y="352" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1a1f1c">handler logic</text>
  <text x="700" y="378" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#6b7268">201 Created</text>

  <!-- invalid branch -->
  <line x1="500" y1="310" x2="500" y2="335" stroke="#1a1f1c" stroke-width="1.5" marker-end="url(#rl-arrow)"/>
  <text x="482" y="330" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" font-style="italic" fill="#6b7268">invalid</text>

  <rect x="390" y="335" width="220" height="75" rx="10" fill="#f6f4ee" stroke="#d9d3c5" stroke-width="1"/>
  <text x="500" y="366" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#1a1f1c">400 — validation_failed</text>
  <text x="500" y="390" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-style="italic" fill="#6b7268">shaped by shapeErrors, no internals</text>
</svg>
