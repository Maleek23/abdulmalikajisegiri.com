<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="TM4C123 low-power mode spectrum with the feeder's run-to-hibernate cycle highlighted">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6" fill="none" stroke="#1a1f1c" stroke-width="1.5"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6" fill="none" stroke="#1d5c3f" stroke-width="2"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="450" fill="#f6f4ee"/>

  <text x="40" y="38" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#1a1f1c">Power modes on the TM4C123</text>
  <text x="40" y="60" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13" fill="#6b7268">Illustrative — relative power savings, not measured values</text>

  <!-- spectrum boxes -->
  <g>
    <rect x="40" y="92" width="165" height="122" rx="8" fill="#fdfcf8" stroke="#1a1f1c" stroke-width="1.5"/>
    <text x="122.5" y="126" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="16" fill="#1a1f1c">RUN</text>
    <text x="122.5" y="150" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#6b7268">full clocks</text>
    <text x="122.5" y="170" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#6b7268">peripherals live</text>

    <rect x="225" y="92" width="165" height="122" rx="8" fill="#fdfcf8" stroke="#1a1f1c" stroke-width="1.5"/>
    <text x="307.5" y="126" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="16" fill="#1a1f1c">SLEEP</text>
    <text x="307.5" y="150" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#6b7268">CPU clock gated</text>
    <text x="307.5" y="170" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#6b7268">peripherals optionally alive</text>

    <rect x="410" y="92" width="165" height="122" rx="8" fill="#fdfcf8" stroke="#1a1f1c" stroke-width="1.5"/>
    <text x="492.5" y="126" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="16" fill="#1a1f1c">DEEP SLEEP</text>
    <text x="492.5" y="150" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#6b7268">most clocks off</text>
    <text x="492.5" y="170" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#6b7268">SRAM retained</text>

    <rect x="595" y="92" width="165" height="122" rx="8" fill="#fdfcf8" stroke="#1d5c3f" stroke-width="2.5"/>
    <text x="677.5" y="126" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="16" fill="#1d5c3f">HIBERNATE</text>
    <text x="677.5" y="150" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#6b7268">on the order of microamps</text>
    <text x="677.5" y="170" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#6b7268">RTC kept alive on VBAT</text>
    <text x="677.5" y="190" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#6b7268">SRAM lost on wake</text>
  </g>

  <!-- inter-box arrows -->
  <g stroke="#1a1f1c" stroke-width="1.5">
    <line x1="209" y1="153" x2="221" y2="153" marker-end="url(#arr)"/>
    <line x1="394" y1="153" x2="406" y2="153" marker-end="url(#arr)"/>
    <line x1="579" y1="153" x2="591" y2="153" marker-end="url(#arr)"/>
  </g>

  <!-- the feeder's cycle: RUN -> hibernate -->
  <line x1="122.5" y1="220" x2="122.5" y2="360" stroke="#1d5c3f" stroke-width="2" marker-end="url(#arrG)"/>
  <text x="140" y="296" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#1d5c3f">HibernateRequest()</text>
  <text x="140" y="316" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#6b7268">arm next wake, then hibernate</text>

  <!-- bottom lane with hibernate state pill -->
  <line x1="122.5" y1="366" x2="322" y2="366" stroke="#1d5c3f" stroke-width="2"/>
  <line x1="478" y1="366" x2="677.5" y2="366" stroke="#1d5c3f" stroke-width="2"/>
  <rect x="322" y="347" width="156" height="38" rx="19" fill="#f6f4ee" stroke="#1d5c3f" stroke-width="1.5"/>
  <text x="400" y="371" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="13" fill="#1d5c3f">HIBERNATE · ≈ µA</text>

  <!-- wake return: hibernate -> RUN -->
  <line x1="677.5" y1="366" x2="677.5" y2="220" stroke="#1d5c3f" stroke-width="2" marker-end="url(#arrG)"/>
  <text x="660" y="296" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1d5c3f">wake sources</text>
  <text x="660" y="316" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#6b7268">RTC match · PIR pin wake</text>

  <text x="40" y="426" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13" fill="#6b7268">The feeder spends ≈99% of its life with nothing to do — so idle means hibernate, not sleep.</text>
</svg>
