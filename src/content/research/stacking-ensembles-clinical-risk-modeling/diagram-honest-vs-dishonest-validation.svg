<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 512" role="img" aria-label="Honest versus dishonest stacking validation comparison">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#6b7268" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="512" fill="#f6f4ee"/>

  <text x="400" y="38" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#1a1f1c">Honest vs. dishonest stacking</text>
  <text x="400" y="61" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12.5" font-style="italic" fill="#6b7268">Same base learners, different validation discipline — only one of these stacks generalizes.</text>

  <line x1="400" y1="84" x2="400" y2="452" stroke="#d9d4c4" stroke-width="1" stroke-dasharray="5 5"/>

  <!-- ============ LEFT: dishonest ============ -->
  <text x="200" y="106" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15.5" font-weight="bold" fill="#a3543a">✕  The dishonest shortcut</text>

  <g>
    <rect x="24" y="126" width="352" height="62" rx="8" fill="#fbfaf6" stroke="#d9d4c4" stroke-width="1.25"/>
    <text x="200" y="150" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14.5" fill="#1a1f1c">1 · Train on all rows</text>
    <text x="200" y="170" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#6b7268">RF + GB fit on the full training set</text>
  </g>
  <line x1="200" y1="192" x2="200" y2="206" stroke="#6b7268" stroke-width="1.25" marker-end="url(#arrow)"/>
  <g>
    <rect x="24" y="210" width="352" height="62" rx="8" fill="#fbfaf6" stroke="#d9d4c4" stroke-width="1.25"/>
    <text x="200" y="234" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14.5" fill="#1a1f1c">2 · Predict the same rows</text>
    <text x="200" y="254" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#6b7268">in-sample predictions — optimistic, esp. GB</text>
  </g>
  <line x1="200" y1="276" x2="200" y2="290" stroke="#6b7268" stroke-width="1.25" marker-end="url(#arrow)"/>
  <text x="218" y="289" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-style="italic" fill="#a3543a">✕ leakage</text>
  <g>
    <rect x="24" y="294" width="352" height="62" rx="8" fill="#fbfaf6" stroke="#d9d4c4" stroke-width="1.25"/>
    <text x="200" y="318" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14.5" fill="#1a1f1c">3 · Fit the meta-learner</text>
    <text x="200" y="338" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#6b7268">RidgeCV learns fiction: “GB is always right”</text>
  </g>
  <g>
    <rect x="24" y="372" width="352" height="80" rx="8" fill="#f6ebe3" stroke="#a3543a" stroke-width="1.25"/>
    <text x="200" y="397" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1a1f1c">In-sample score: <tspan font-style="italic">deceptively high</tspan></text>
    <text x="200" y="422" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#a3543a">→ the gain evaporates on new data</text>
  </g>

  <!-- ============ RIGHT: honest ============ -->
  <text x="600" y="106" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15.5" font-weight="bold" fill="#1d5c3f">✓  The honest stack (out-of-fold)</text>

  <g>
    <rect x="424" y="126" width="352" height="62" rx="8" fill="#fbfaf6" stroke="#d9d4c4" stroke-width="1.25"/>
    <text x="600" y="150" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14.5" fill="#1a1f1c">1 · K-fold rotation</text>
    <text x="600" y="170" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#6b7268">train on K−1 folds → predict held-out fold</text>
  </g>
  <line x1="600" y1="192" x2="600" y2="206" stroke="#6b7268" stroke-width="1.25" marker-end="url(#arrow)"/>
  <g>
    <rect x="424" y="210" width="352" height="62" rx="8" fill="#fbfaf6" stroke="#d9d4c4" stroke-width="1.25"/>
    <text x="600" y="234" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14.5" fill="#1a1f1c">2 · Concatenate folds</text>
    <text x="600" y="254" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#6b7268">every row predicted by a model that never saw it</text>
  </g>
  <line x1="600" y1="276" x2="600" y2="290" stroke="#6b7268" stroke-width="1.25" marker-end="url(#arrow)"/>
  <text x="618" y="289" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-style="italic" fill="#1d5c3f">✓ no leakage</text>
  <g>
    <rect x="424" y="294" width="352" height="62" rx="8" fill="#fbfaf6" stroke="#d9d4c4" stroke-width="1.25"/>
    <text x="600" y="318" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14.5" fill="#1a1f1c">3 · Fit the meta-learner</text>
    <text x="600" y="338" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#6b7268">RidgeCV on out-of-fold predictions only</text>
  </g>
  <g>
    <rect x="424" y="372" width="352" height="80" rx="8" fill="#e9f1ea" stroke="#1d5c3f" stroke-width="1.25"/>
    <text x="600" y="397" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1a1f1c">Held-out R² <tspan font-weight="bold">0.78 → 0.81</tspan></text>
    <text x="600" y="422" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1d5c3f">→ real, modest, honest — and it generalizes</text>
  </g>

  <text x="400" y="492" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" font-style="italic" fill="#6b7268">Failure mode is illustrative; the R² 0.78 → 0.81 figure is the project’s measured held-out result.</text>
</svg>
