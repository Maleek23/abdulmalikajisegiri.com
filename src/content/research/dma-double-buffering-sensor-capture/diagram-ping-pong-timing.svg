<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Ping-pong buffer timing diagram">
  <rect x="0.5" y="0.5" width="799" height="449" fill="#f6f4ee" stroke="#d9d4c6"/>
  <text x="36" y="46" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#1a1f1c">Ping-pong buffer timing (illustrative)</text>

  <!-- lane labels -->
  <text x="36" y="132" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1a1f1c">DMA writes</text>
  <text x="36" y="222" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1a1f1c">CPU processes</text>

  <!-- DMA lane -->
  <rect x="210" y="100" width="140" height="54" fill="#d9e9df" stroke="#1d5c3f" stroke-width="1.5"/>
  <text x="280" y="132" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1a1f1c">Buffer A</text>
  <rect x="350" y="100" width="140" height="54" fill="#edf1ec" stroke="#1d5c3f" stroke-width="1.5"/>
  <text x="420" y="132" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1a1f1c">Buffer B</text>
  <rect x="490" y="100" width="140" height="54" fill="#d9e9df" stroke="#1d5c3f" stroke-width="1.5"/>
  <text x="560" y="132" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1a1f1c">Buffer A</text>
  <rect x="630" y="100" width="140" height="54" fill="#edf1ec" stroke="#1d5c3f" stroke-width="1.5"/>
  <text x="700" y="132" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1a1f1c">Buffer B</text>

  <!-- CPU lane -->
  <rect x="210" y="190" width="140" height="54" fill="#fcfbf7" stroke="#1a1f1c" stroke-width="1"/>
  <text x="280" y="222" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#6b7268">CPU processes B</text>
  <rect x="350" y="190" width="140" height="54" fill="#fcfbf7" stroke="#1a1f1c" stroke-width="1"/>
  <text x="420" y="222" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#6b7268">CPU processes A</text>
  <rect x="490" y="190" width="140" height="54" fill="#fcfbf7" stroke="#1a1f1c" stroke-width="1"/>
  <text x="560" y="222" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#6b7268">CPU processes B</text>
  <rect x="630" y="190" width="140" height="54" fill="#fcfbf7" stroke="#1a1f1c" stroke-width="1"/>
  <text x="700" y="222" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#6b7268">CPU processes A</text>

  <!-- buffer-swap instants -->
  <line x1="350" y1="84" x2="350" y2="262" stroke="#1d5c3f" stroke-width="2" stroke-dasharray="7 5"/>
  <line x1="490" y1="84" x2="490" y2="262" stroke="#1d5c3f" stroke-width="2" stroke-dasharray="7 5"/>
  <line x1="630" y1="84" x2="630" y2="262" stroke="#1d5c3f" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="350" y="74" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12.5" fill="#1d5c3f">half-transfer ISR</text>
  <text x="490" y="74" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12.5" fill="#1d5c3f">transfer-complete ISR</text>
  <text x="630" y="74" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12.5" fill="#1d5c3f">half-transfer ISR</text>
  <text x="350" y="280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#1d5c3f">bufAReady = true</text>
  <text x="490" y="280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#1d5c3f">bufBReady = true</text>
  <text x="630" y="280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#1d5c3f">bufAReady = true</text>

  <!-- time axis -->
  <line x1="210" y1="296" x2="770" y2="296" stroke="#1a1f1c" stroke-width="1"/>
  <line x1="210" y1="292" x2="210" y2="300" stroke="#1a1f1c" stroke-width="1"/>
  <line x1="350" y1="292" x2="350" y2="300" stroke="#1a1f1c" stroke-width="1"/>
  <line x1="490" y1="292" x2="490" y2="300" stroke="#1a1f1c" stroke-width="1"/>
  <line x1="630" y1="292" x2="630" y2="300" stroke="#1a1f1c" stroke-width="1"/>
  <line x1="770" y1="292" x2="770" y2="300" stroke="#1a1f1c" stroke-width="1"/>
  <text x="210" y="318" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#6b7268">t0</text>
  <text x="350" y="318" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#6b7268">t1</text>
  <text x="490" y="318" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#6b7268">t2</text>
  <text x="630" y="318" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#6b7268">t3</text>
  <text x="770" y="318" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#6b7268">t4</text>

  <!-- overrun deadline bracket -->
  <line x1="350" y1="340" x2="490" y2="340" stroke="#6b7268" stroke-width="1"/>
  <line x1="350" y1="334" x2="350" y2="346" stroke="#6b7268" stroke-width="1"/>
  <line x1="490" y1="334" x2="490" y2="346" stroke="#6b7268" stroke-width="1"/>
  <text x="420" y="364" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#6b7268">CPU must finish a buffer within one half-fill: BUF_LEN / SAMPLE_RATE</text>

  <text x="400" y="408" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" font-style="italic" fill="#1a1f1c">Invariant: the DMA and CPU never touch the same buffer at the same time.</text>
</svg>
