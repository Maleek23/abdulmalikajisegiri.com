<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-label="Illustrative schematic comparing walk-forward validation with purged k-fold cross-validation with an embargo gap, for financial time series.">
<defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
<line x1="0" y1="0" x2="0" y2="8" stroke="#6b7268" stroke-width="1.5"/>
</pattern>
</defs>
<rect x="0" y="0" width="800" height="520" rx="10" fill="#f6f4ee"/>
<text x="40" y="36" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#1a1f1c">Walk-forward vs. purged k-fold: keep the future out of the test set</text>
<text x="40" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#6b7268">Illustrative schematic — window sizes and embargo width chosen for legibility, not real data.</text>

<text x="40" y="92" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#1a1f1c">A · Walk-forward (expanding window): tune in-sample, report out-of-sample</text>

<text x="40" y="116" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#1a1f1c">Fold 1</text>
<rect x="150" y="101" width="320" height="22" fill="#1d5c3f"/>
<text x="162" y="116" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#f6f4ee">train (in-sample)</text>
<rect x="470" y="101" width="90" height="22" fill="#1a1f1c"/>
<text x="515" y="116" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#f6f4ee">OOS</text>
<text x="752" y="116" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6b7268">time</text>
<line x1="780" y1="112" x2="793" y2="112" stroke="#6b7268" stroke-width="1.2"/>
<polygon points="793,108.5 793,115.5 799,112" fill="#6b7268"/>

<text x="40" y="154" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#1a1f1c">Fold 2</text>
<rect x="150" y="139" width="410" height="22" fill="#1d5c3f"/>
<text x="162" y="154" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#f6f4ee">train (in-sample)</text>
<rect x="560" y="139" width="90" height="22" fill="#1a1f1c"/>
<text x="605" y="154" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#f6f4ee">OOS</text>
<text x="752" y="154" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6b7268">time</text>
<line x1="780" y1="150" x2="793" y2="150" stroke="#6b7268" stroke-width="1.2"/>
<polygon points="793,146.5 793,153.5 799,150" fill="#6b7268"/>

<text x="40" y="192" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#1a1f1c">Fold 3</text>
<rect x="150" y="177" width="500" height="22" fill="#1d5c3f"/>
<text x="162" y="192" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#f6f4ee">train (in-sample)</text>
<rect x="650" y="177" width="90" height="22" fill="#1a1f1c"/>
<text x="695" y="192" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#f6f4ee">OOS</text>
<text x="752" y="192" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6b7268">time</text>
<line x1="780" y1="188" x2="793" y2="188" stroke="#6b7268" stroke-width="1.2"/>
<polygon points="793,184.5 793,191.5 799,188" fill="#6b7268"/>

<text x="150" y="222" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-style="italic" fill="#1a1f1c">Report only the dark segments. The in-sample fit is training loss, not a performance claim.</text>

<line x1="40" y1="240" x2="760" y2="240" stroke="#d8d4c8" stroke-width="1"/>

<text x="40" y="268" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#1a1f1c">B · Purged k-fold with embargo: delete labels that peek across the fold boundary</text>

<rect x="150" y="288" width="180" height="34" fill="#1d5c3f"/>
<rect x="330" y="288" width="60" height="34" fill="url(#hatch)" stroke="#6b7268" stroke-width="1"/>
<rect x="390" y="288" width="120" height="34" fill="#1a1f1c"/>
<rect x="510" y="288" width="60" height="34" fill="url(#hatch)" stroke="#6b7268" stroke-width="1"/>
<rect x="570" y="288" width="60" height="34" fill="url(#hatch)" stroke="#1d5c3f" stroke-width="1.5" stroke-dasharray="5 4"/>
<rect x="630" y="288" width="120" height="34" fill="#1d5c3f"/>
<text x="240" y="309" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#f6f4ee">train</text>
<text x="450" y="309" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#f6f4ee">test fold</text>
<text x="690" y="309" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#f6f4ee">train</text>
<text x="752" y="309" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6b7268">time</text>
<line x1="780" y1="305" x2="793" y2="305" stroke="#6b7268" stroke-width="1.2"/>
<polygon points="793,301.5 793,308.5 799,305" fill="#6b7268"/>

<line x1="330" y1="322" x2="330" y2="338" stroke="#6b7268" stroke-width="1"/>
<line x1="390" y1="322" x2="390" y2="338" stroke="#6b7268" stroke-width="1"/>
<text x="360" y="352" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6b7268">purged</text>
<line x1="510" y1="322" x2="510" y2="338" stroke="#6b7268" stroke-width="1"/>
<text x="540" y="352" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6b7268">purged</text>
<line x1="570" y1="322" x2="570" y2="338" stroke="#1d5c3f" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="630" y1="322" x2="630" y2="338" stroke="#1d5c3f" stroke-width="1" stroke-dasharray="4 3"/>
<text x="600" y="352" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#1d5c3f">embargo</text>

<text x="150" y="410" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-style="italic" fill="#1a1f1c">Purge applies on both sides; the embargo guards against serial dependence past the boundary.</text>

<line x1="40" y1="428" x2="760" y2="428" stroke="#d8d4c8" stroke-width="1"/>

<rect x="40" y="444" width="26" height="16" fill="#1d5c3f"/>
<text x="74" y="457" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#1a1f1c">train</text>
<rect x="150" y="444" width="26" height="16" fill="#1a1f1c"/>
<text x="184" y="457" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#1a1f1c">test / OOS</text>
<rect x="300" y="444" width="26" height="16" fill="url(#hatch)" stroke="#6b7268" stroke-width="1"/>
<text x="334" y="457" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#1a1f1c">purged</text>
<rect x="430" y="444" width="26" height="16" fill="url(#hatch)" stroke="#1d5c3f" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="464" y="457" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#1a1f1c">embargo</text>

<text x="40" y="492" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-style="italic" fill="#6b7268">Both schemes exist for one reason: no training observation may know anything the live strategy could not have known.</text>
</svg>
